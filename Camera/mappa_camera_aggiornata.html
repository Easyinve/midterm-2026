<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I risultati alla Camera</title>
<style>
/* ============================================================
   IL POST — token di stile per grafici e mappe
   Colore portante: azzurro della "S" del logo, #17B4D4
   Mobile prima di tutto (si progetta a 360 px) e sempre con la versione scura.
   ============================================================ */
:root{
  color-scheme: light dark;
  /* brand */
  --azzurro:#17B4D4;   /* serie principale, barre singole */
  --giallo:#FFE725;    /* evidenziazione puntuale (sfondo di un'etichetta), mai per serie */
  --su-giallo:#111110; /* testo sopra il giallo, uguale nei due temi */
  --rosso:#C90101;     /* un solo valore da segnalare, con parsimonia */
  --ink:#111110;       /* titoli */
  --testo:#3a3a38;     /* sommario */
  --muted:#6b6b6b;     /* etichette assi, legende */
  --fonte:#8a8a87;     /* riga della fonte (abbastanza scura da leggersi su telefono) */
  --griglia:#eeeeee;   /* griglia orizzontale */
  --asse:#d9d9d9;      /* linea dell'asse x */
  --hair:#e6e4df;      /* filetti */
  --bg:#ffffff;
  --sfondo-serie:#cfcfcf; /* serie di contesto, in grigio */
  --land:#f4f2ec;      /* terre nelle mappe */
  --confine:#d8d4ca;   /* confini nelle mappe */
  --nodata:#e9e7e2;    /* dato mancante */
  --tip-bg:#ffffff;
  --tip-ombra:0 4px 16px rgba(0,0,0,.12);

  /* sequenziale azzurra, 7 classi: valori bassi vicini allo sfondo, alti contrastati */
  --c1:#e3f5fa; --c2:#b3e6f1; --c3:#74d2e6; --c4:#2fbdd9;
  --c5:#17B4D4; --c6:#0e7e9b; --c7:#0a4f63;

  /* divergente: rosso <- neutro -> azzurro/petrolio */
  --d1:#8f0a0a; --d2:#c94a3a; --d3:#eab0a6; --d4:#f2f1ee;
  --d5:#9fdcec; --d6:#17B4D4; --d7:#0a4f63;

  /* categorica, nell'ordine d'uso */
  --cat1:#17B4D4; --cat2:#0e7e9b; --cat3:#f0a830;
  --cat4:#C90101; --cat5:#6b6b6b; --cat6:#9ec9d8;

  /* tipografia */
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;

  /* misure mobile */
  --etichetta:12px;    /* minimo per assi e legende: sotto non si legge sul telefono */
  --altezza-grafico:clamp(280px,70vw,440px);
}

/* ---------- tema scuro ----------
   Stessi nomi, valori diversi: il codice usa solo var(--…) e si adatta da solo.
   L'azzurro resta quello del marchio; cambiano i colori che sul nero non si leggono. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --rosso:#ff5a4f; --ink:#f2f1ee; --testo:#c9c8c3; --muted:#a3a29d; --fonte:#8c8b86;
    --griglia:#2c2c2a; --asse:#4a4a46; --hair:#363632; --bg:#161615; --sfondo-serie:#4a4a46;
    --land:#22221f; --confine:#3d3d39; --nodata:#2f2f2c;
    --tip-bg:#242422; --tip-ombra:0 4px 16px rgba(0,0,0,.5);
    --c1:#15343d; --c2:#145466; --c3:#0e7e9b; --c4:#17B4D4; --c5:#4fc8e0; --c6:#8fdcec; --c7:#d2f2f9;
    --d1:#ff8a7a; --d2:#d9574a; --d3:#7a2a24; --d4:#2e2e2b; --d5:#145466; --d6:#17B4D4; --d7:#9fe3f2;
    --cat2:#7fd6ea; --cat4:#ff5a4f; --cat5:#a3a29d; --cat6:#3f7f92;
  }
}
:root[data-theme="dark"]{
    --rosso:#ff5a4f; --ink:#f2f1ee; --testo:#c9c8c3; --muted:#a3a29d; --fonte:#8c8b86;
    --griglia:#2c2c2a; --asse:#4a4a46; --hair:#363632; --bg:#161615; --sfondo-serie:#4a4a46;
    --land:#22221f; --confine:#3d3d39; --nodata:#2f2f2c;
    --tip-bg:#242422; --tip-ombra:0 4px 16px rgba(0,0,0,.5);
    --c1:#15343d; --c2:#145466; --c3:#0e7e9b; --c4:#17B4D4; --c5:#4fc8e0; --c6:#8fdcec; --c7:#d2f2f9;
    --d1:#ff8a7a; --d2:#d9574a; --d3:#7a2a24; --d4:#2e2e2b; --d5:#145466; --d6:#17B4D4; --d7:#9fe3f2;
    --cat2:#7fd6ea; --cat4:#ff5a4f; --cat5:#a3a29d; --cat6:#3f7f92;
}

/* ---------- pagina e contenitore ---------- */
html,body{background:var(--bg);color:var(--ink);margin:0}
.ilpost-chart{box-sizing:border-box;max-width:720px;margin:0 auto;padding:16px 16px 12px;font-family:var(--sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ilpost-canvas{position:relative;width:100%;height:var(--altezza-grafico)}
.ilpost-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}   /* tabelle e grafici larghi: scorrono qui, mai la pagina */
.ilpost-chart svg,.ilpost-chart img,.ilpost-chart canvas{max-width:100%}

/* ---------- blocco editoriale: intestazione (titolo + logo), sommario, fonte. Niente occhiello. ---------- */
.ilpost-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 8px}
.ilpost-head .ilpost-title{margin:0;flex:1;min-width:0}
.ilpost-logo{flex:none;height:14px;width:auto;margin-top:6px;display:block;opacity:.9}   /* piccolo: firma, non protagonista */
/* due loghi nell'HTML, se ne vede uno: positivo su chiaro, negativo su scuro */
.ilpost-logo--scuro{display:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .ilpost-logo--chiaro{display:none}
  :root:not([data-theme="light"]) .ilpost-logo--scuro{display:block}
}
:root[data-theme="dark"] .ilpost-logo--chiaro{display:none}
:root[data-theme="dark"] .ilpost-logo--scuro{display:block}

.ilpost-title{font-family:var(--serif);font-weight:700;font-size:clamp(21px,5.6vw,34px);
  line-height:1.12;letter-spacing:-.01em;margin:0 0 10px;color:var(--ink);text-wrap:balance}
.ilpost-lead{font-family:var(--sans);font-size:15px;color:var(--testo);margin:0 0 14px;line-height:1.45;max-width:64ch}
.ilpost-src{font-family:var(--sans);font-size:12px;color:var(--fonte);margin-top:8px;line-height:1.4}
.ilpost-legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink);margin:0 0 8px}
.ilpost-legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;
  background:var(--c,var(--azzurro));margin-right:6px;vertical-align:-1px}
.ilpost-note{font-size:13px;color:var(--testo);line-height:1.4}
.ilpost-tip{background:var(--tip-bg);border:0;border-radius:6px;box-shadow:var(--tip-ombra);
  font-family:var(--sans);font-size:13px;color:var(--ink);padding:8px 10px;max-width:min(260px,80vw)}
.ilpost-mark{background:var(--giallo);color:var(--su-giallo);padding:0 3px}   /* il giallo vale solo come sfondo */
/* controlli (filtri, selettori): bersagli da dito */
.ilpost-chart button,.ilpost-chart select,.ilpost-chart input{min-height:44px;font:inherit;font-size:15px;
  color:var(--ink);background:var(--bg);border:1px solid var(--hair);border-radius:6px;padding:0 12px}

@media (max-width:480px){
  .ilpost-logo{height:12px;margin-top:4px}
  .ilpost-lead{font-size:14px}
}
</style>
</head>

  <p class="ilpost-lead">I 435 distretti colorati secondo il partito del candidato in vantaggio</p>
  <style>
/* Tre gradazioni per partito secondo il distacco tra primo e secondo:
   1 sotto 10 punti, 2 da 10 a 30, 3 oltre 30 (più intenso). */
:root{
  --dem1:#c6d6e1; --dem2:#7899b0; --dem3:#2e5a7c;
  --rep1:#f2c5c1; --rep2:#d97b70; --rep3:#cc3a2c;
  --dem:var(--dem3); --rep:var(--rep3);
  --ind:#f0a830;
  --confine-area:#ffffff; --confine-stato:#ffffff;
  --novoto:#bdb9b0;   /* dove non si vota */
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --dem1:#33485a; --dem2:#55809f; --dem3:#8db8db;
    --rep1:#5c3532; --rep2:#a5544b; --rep3:#e65a4c;
    --confine-area:#161615; --confine-stato:#161615; --novoto:#4a4944;
  }
}
:root[data-theme="dark"]{
  --dem1:#33485a; --dem2:#55809f; --dem3:#8db8db;
  --rep1:#5c3532; --rep2:#a5544b; --rep3:#e65a4c;
  --confine-area:#161615; --confine-stato:#161615; --novoto:#4a4944;
}
.ilpost-canvas{height:auto;position:relative}
#grafico svg{display:block;width:100%;height:auto;touch-action:manipulation}
.area{stroke:var(--confine-area);stroke-width:.25px;vector-effect:non-scaling-stroke;fill:var(--nodata)}
.area.d1{fill:var(--dem1)} .area.d2{fill:var(--dem2)} .area.d3{fill:var(--dem3)}
.area.r1{fill:var(--rep1)} .area.r2{fill:var(--rep2)} .area.r3{fill:var(--rep3)}
.area.i{fill:var(--ind)}
.area.nv{fill:var(--novoto)}
.area.attiva{stroke:var(--ink);stroke-width:1.5px}
.stati{fill:none;stroke:var(--confine-stato);stroke-width:1.1px;vector-effect:non-scaling-stroke;pointer-events:none}
/* legenda: tre caselle per partito, dal distacco più ampio al più stretto verso il centro */
.legenda{display:flex;flex-wrap:wrap;gap:10px 40px;font-size:14px;color:var(--ink);margin:0 0 12px;align-items:center}
.legenda .gr{display:flex;align-items:center;gap:12px}
.legenda .cas{display:flex}
.legenda .cas i{display:block;width:40px;height:16px}
.legenda .nd{display:flex;align-items:center;gap:8px;flex-basis:100%}
.legenda .nd i{display:inline-block;width:16px;height:16px;background:var(--nodata)}
.legenda-nota{font-size:13px;color:var(--testo);margin:10px 0 0;line-height:1.4}
#tip{position:absolute;pointer-events:none;opacity:0;transition:opacity .1s;z-index:2;border-top:4px solid var(--nodata);
  width:min(290px,86vw);max-width:none;padding:10px 12px 8px;box-sizing:border-box}
#tip .t-cont{font-family:var(--serif);font-weight:700;font-size:16px;line-height:1.2;color:var(--ink)}
#tip .t-stato{font-size:12px;color:var(--muted);margin-top:1px}
#tip .t-esito{font-size:13px;color:var(--ink);margin-top:6px;line-height:1.35}
#tip .t-esito .rib{display:inline-block;font-size:11px;font-weight:700;color:#fff;padding:1px 5px;border-radius:2px;margin-left:4px;vertical-align:1px}
#tip .t-scr{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:8px 0 6px;font-variant-numeric:tabular-nums}
#tip .t-scr .bar{flex:1;height:4px;background:var(--griglia);border-radius:2px;overflow:hidden}

<script>
(function(){
  const css = n => getComputedStyle(document.documentElement).getPropertyValue('--'+n).trim();
  /* Numeri all'italiana scritti a mano: i formattatori del browser per l'italiano, con i dati
     di localizzazione recenti omettono il punto sotto le 10.000 (1234 invece di 1.234), e il
     risultato cambia da browser a browser. Qui il punto delle migliaia c'è sempre. */
  const num = (v, d=0) => {
    if (v == null || v === '' || !isFinite(v)) return '';
    let [i, f] = Math.abs(+v).toFixed(d).split('.');
    i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
    const s = f ? i + ',' + f : i;
    return (+v < 0 && /[1-9]/.test(s) ? '-' : '') + s;
  };
  /* decimali presi dal valore, al massimo 2: 1234 -> "1.234", 12.5 -> "12,5" */
  const auto = v => { const m = String(+v).match(/\.(\d+)/); return num(v, m ? Math.min(m[1].length, 2) : 0); };
  window.ILPOST = {
    colore: css,
    num, auto,
    pct: (v,d=1) => num(v,d) + '%',
    eur: (v,d=0) => num(v,d) + '\u00a0€',
    /* per D3: d3.format con il punto delle migliaia sempre presente */
    d3locale: () => d3.formatLocale({decimal:',', thousands:'.', grouping:[3], currency:['', '\u00a0€']}),
    mobile: () => matchMedia('(max-width: 480px)').matches,
    /* ILPOST.alCambio(disegna): ridisegna al cambio di tema o di larghezza */
    alCambio(fn){
      let t; const run = () => { clearTimeout(t); t = setTimeout(fn, 60); };
      matchMedia('(prefers-color-scheme: dark)').addEventListener('change', run);
      new MutationObserver(run).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
      new ResizeObserver(run).observe(document.getElementById('grafico') || document.body);
      fn();
    }
  };
})();
</script>

const STATI = {1:"Alabama",2:"Alaska",4:"Arizona",5:"Arkansas",6:"California",8:"Colorado",9:"Connecticut",
10:"Delaware",12:"Florida",13:"Georgia",15:"Hawaii",16:"Idaho",17:"Illinois",18:"Indiana",19:"Iowa",20:"Kansas",
21:"Kentucky",22:"Louisiana",23:"Maine",24:"Maryland",25:"Massachusetts",26:"Michigan",27:"Minnesota",
28:"Mississippi",29:"Missouri",30:"Montana",31:"Nebraska",32:"Nevada",33:"New Hampshire",34:"New Jersey",
35:"Nuovo Messico",36:"New York",37:"Carolina del Nord",38:"Dakota del Nord",39:"Ohio",40:"Oklahoma",
41:"Oregon",42:"Pennsylvania",44:"Rhode Island",45:"Carolina del Sud",46:"Dakota del Sud",47:"Tennessee",
48:"Texas",49:"Utah",50:"Vermont",51:"Virginia",53:"Washington",54:"Virginia Occidentale",55:"Wisconsin",56:"Wyoming"};

const distretti = topojson.feature(MAPPA, MAPPA.objects.distretti).features;
const confini = topojson.mesh(MAPPA, MAPPA.objects.stati, (a, b) => a !== b);

const SIGLA = {Democratic: 'D', Republican: 'R', Independent: 'Ind.', Libertarian: 'Lib.', Green: 'Verdi', 'Write-In': 'scritto a mano', 'Write-in': 'scritto a mano', Nonpartisan: 'senza partito'};
const COLORE = {Democratic: 'var(--dem)', Republican: 'var(--rep)', Independent: 'var(--ind)'};
const LETTERA = {Democratic: 'd', Republican: 'r', Independent: 'i'};
const esc = s => String(s).replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
/* candidati in ordine di voti; a parità (anche a zero) resta l'ordine della fonte */
const ordinati = v => v.c.map((c, i) => [c, i]).sort((a, b) => b[0][2] - a[0][2] || a[1] - b[1]).map(x => x[0]);
function tabella(v) {
  const tot = d3.sum(v.c, x => x[2]);
  if (!tot) return '<div class="vuoto">Nessun voto scrutinato ancora.</div>';
  return `<div class="t-scr"><span>Schede scrutinate</span><span class="bar"><i style="width:${Math.min(100, v.pr)}%"></i></span><span>${ILPOST.num(v.pr)}%</span></div>` +
    `<div class="t-tab"><span></span><span class="t-int">Candidato</span><span class="t-int n">Voti</span><span class="t-int n">%</span>` +
    ordinati(v).filter(x => x[2] > 0).map((x, i) => {   /* solo i candidati che hanno preso voti */
      const col = COLORE[x[1]] || 'var(--sfondo-serie)', primo = tot > 0 && i === 0 ? ' primo' : '';
      return `<span class="pal" style="background:${col}"></span>` +
             `<span class="nome${primo}" title="${esc(x[0])}">${esc(x[0])}${x[4] ? ' ✓' : ''} <small>${esc(SIGLA[x[1]] || x[1])}</small></span>` +
             `<span class="voti">${ILPOST.num(x[2])}</span>` +
             `<span class="perc${primo}">${ILPOST.pct(x[3])}</span>` +
             `<span class="riga-bar"><i style="width:${Math.min(100, x[3])}%;background:${col}"></i></span>`;
    }).join('') + '</div>';
}
const coloreBordo = c => /^d/.test(c) ? 'var(--dem)' : /^r/.test(c) ? 'var(--rep)' : /^i/.test(c) ? 'var(--ind)' : c === 'nv' ? 'var(--novoto)' : 'var(--nodata)';

const box = document.getElementById('grafico');
const tip = document.getElementById('tip');
function posiziona(ev) {
  const r = box.getBoundingClientRect();
  let x = ev.clientX - r.left + 12, y = ev.clientY - r.top + 12;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw > r.width) x = Math.max(0, ev.clientX - r.left - tw - 12);
  x = Math.max(0, Math.min(x, r.width - tw));
  if (y + th > r.height) y = Math.max(0, Math.min(ev.clientY - r.top - th - 12, r.height - th));
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.style.opacity = 1;
}
let attiva = null;
function evidenzia(ev, g) {
  if (attiva) attiva.classList.remove('attiva');
  attiva = ev.currentTarget; attiva.classList.add('attiva'); attiva.parentNode.appendChild(attiva);
  g.select('.stati').raise();
}
function nascondi() {
  if (attiva) attiva.classList.remove('attiva');
  attiva = null; tip.style.opacity = 0;
}

const ribaltati = new Set(RIBALTATI);
const vincitore = v => v && v.c.find(c => c[4]);
/* partito in vantaggio e gradazione: 1 sotto 10 punti di distacco, 2 da 10 a 30, 3 oltre 30.
   Senza voti resta grigio, a meno che il vincitore sia già annunciato (candidato unico). */
function classe(id) {
  const v = RISULTATI[id];
  if (!v || !v.c.length) return '';
  const tot = d3.sum(v.c, x => x[2]);
  if (!tot) { const w = vincitore(v), l = w && LETTERA[w[1]]; return !l ? '' : l === 'i' ? 'i' : l + '3'; }
  const [a, b] = ordinati(v), l = LETTERA[a[1]];
  if (!l) return '';
  if (l === 'i') return 'i';
  const dist = (a[2] - (b ? b[2] : 0)) / tot * 100;
  return l + (dist < 10 ? '1' : dist <= 30 ? '2' : '3');
}

/* coordinate già proiettate (Albers USA), basta adattarle alla larghezza */
const W = 975, H = 610;
const proiezione = d3.geoIdentity().reflectY(true).fitExtent([[4, 4], [W - 4, H - 4]], {type: 'FeatureCollection', features: distretti});
const path = d3.geoPath(proiezione);
const svg = d3.select(box).insert('svg', '#tip').attr('viewBox', `0 0 ${W} ${H}`);
const g = svg.append('g');
const celle = g.selectAll('path.area').data(distretti).join('path')
  .attr('class', f => 'area ' + classe(f.properties.id))
  .attr('d', path);
g.append('path').attr('class', 'stati').attr('d', path(confini));

function mostra(ev, f) {
  evidenzia(ev, g);
  const p = f.properties, v = RISULTATI[p.id], c = classe(p.id), w = vincitore(v);
  let righe;
  if (!v || !v.c.length || (!w && !d3.sum(v.c, x => x[2]))) righe = '<div class="vuoto">Risultato non ancora disponibile.</div>';
  else {
    const rib = w && ribaltati.has(p.id) && LETTERA[w[1]] !== 'i';
    righe = w ? `<div class="t-esito">Vince ${esc(w[0])}${rib ? `<span class="rib" style="background:var(--${LETTERA[w[1]] === 'd' ? 'dem' : 'rep'})">ribaltato</span>` : ''}</div>`
              : '<div class="t-esito">Nessun vincitore ancora</div>';
    righe += tabella(v);
  }
  tip.style.borderTopColor = coloreBordo(c);
  tip.innerHTML = `<div class="t-cont">${p.n === 0 ? 'Distretto unico' : p.n + '° distretto'}</div><div class="t-stato">${STATI[p.s] || ''}</div>${righe}`;
  posiziona(ev);
}

celle.on('pointermove', mostra).on('pointerdown', mostra);
svg.on('pointerleave', ev => { if (ev.pointerType === 'mouse') nascondi(); });
document.addEventListener('pointerdown', ev => { if (!box.contains(ev.target)) nascondi(); });
</script>
